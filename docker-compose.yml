version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # prevents host node_modules from overwriting container's
    environment:
      # Container-to-container: 127.0.0.1 inside frontend is this container, not the backend.
      - BACKEND_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend
    networks:
      - ams-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongo:27017/ams
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      - mongo
      - redis
    networks:
      - ams-net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"       # optional, only if you want host access via Compass etc.
    volumes:
      - mongo-data:/data/db
    networks:
      - ams-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ams-net

networks:
  ams-net:
    driver: bridge

volumes:
  mongo-data: