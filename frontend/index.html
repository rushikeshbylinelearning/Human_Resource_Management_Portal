<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" /> <!-- Changed to .ico as used in the component -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Byline People - Comprehensive attendance management and workforce tracking system for efficient employee time management, leave tracking, and reporting." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D32F2F" />
    
    <!-- PWA / installable web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple PWA support (legacy; keep for older iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Byline Attendance" />
    <link rel="apple-touch-icon" href="/BL.svg" />
    
    <!-- System font stack in body CSS — skip a render-blocking Google Fonts round trip. -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      * {
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    </style>
    
    <title>Byline People</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
