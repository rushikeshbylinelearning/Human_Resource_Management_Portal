name: Deploy to Testing

on:
  push:
    branches:
      - master

env:
  DEPLOY_ROOT: /home/bylinelm/attendance-test.bylinelms.com
  SALARY_DEPLOY_ROOT: /home/bylinelm/payroll-test.bylinelms.com/salary-service
  # Production AMS (attendance.bylinelms.com) stays on :3011.
  # 5005 is already used by dg-awareness-backend on this host.
  AMS_TEST_PORT: 3015
  AMS_PROD_PORT: 3011

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── AMS backend ───────────────────────────────────────────────────────────
      - name: Deploy AMS backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'keys/' \
            --exclude 'logs/' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_ROOT }}/backend/

      - name: Deploy frontend build (dist contents to site root)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'backend' \
            --exclude '.htaccess' \
            --exclude '.well-known' \
            --exclude 'cgi-bin' \
            frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_ROOT }}/

      - name: Deploy test Apache proxy (.htaccess → :3015)
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            deploy/attendance-test.htaccess \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_ROOT }}/.htaccess

      - name: Start test AMS on :3015 via PM2 (do not touch production :3011)
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            source ~/.bashrc
            cd /home/bylinelm/attendance-test.bylinelms.com/backend
            npm ci --omit=dev

            # Test .env lives only on the server (never rsynced). Fill the values
            # required to boot: SESSION_SECRET, PORT=3015, test site URLs.
            node scripts/ensure-test-env.js

            # Only create/replace the TEST process. Never restart/delete production
            # (attendance-backend on :3011) or other apps (e.g. dg-awareness on :5005).
            pm2 delete attendancetest-backend >/dev/null 2>&1 || true

            if ss -lnt 2>/dev/null | grep -q ':3015 ' || netstat -lnt 2>/dev/null | grep -q ':3015 '; then
              echo "ERROR: port 3015 is already in use by another process"
              ss -lntp 2>/dev/null | grep 3015 || netstat -lntp 2>/dev/null | grep 3015 || true
              pm2 list || true
              exit 1
            fi

            PORT=3015 HOST=127.0.0.1 NODE_ENV=production \
              pm2 start ecosystem.config.cjs --only attendancetest-backend --env production --update-env
            pm2 save

            echo "Waiting for attendancetest-backend on :3015..."
            healthy=0
            for i in $(seq 1 20); do
              code=$(curl -sS -o /tmp/ams-test-health.json -w '%{http_code}' "http://127.0.0.1:3015/health" || true)
              body=$(cat /tmp/ams-test-health.json 2>/dev/null || true)
              if [ "$code" = "200" ] && echo "$body" | grep -q '"status"'; then
                echo "attendancetest-backend is healthy on :3015"
                echo "$body"
                echo
                healthy=1
                break
              fi
              echo "health attempt $i: HTTP ${code:-down}"
              sleep 2
            done

            if [ "$healthy" != "1" ]; then
              echo "attendancetest-backend did not become healthy on :3015"
              echo "--- listeners on 3015 ---"
              ss -lntp 2>/dev/null | grep 3015 || netstat -lntp 2>/dev/null | grep 3015 || true
              echo "--- last health body ---"
              cat /tmp/ams-test-health.json 2>/dev/null || true
              echo
              pm2 describe attendancetest-backend || true
              pm2 logs attendancetest-backend --lines 80 --nostream || true
              exit 1
            fi

            echo "Confirming production AMS on :3011 is still up..."
            if ! curl -fsS "http://127.0.0.1:3011/health" >/dev/null; then
              echo "ERROR: production AMS on :3011 is not healthy after test deploy"
              pm2 list || true
              exit 1
            fi
            echo "Production AMS on :3011 is still healthy"
            pm2 list
          EOF

      # ── salary-service frontend ──────────────────────────────────────────────
      - name: Install and build salary-service frontend
        working-directory: salary-service-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api

      # ── salary-service backend + built frontend ───────────────────────────────
      # .env is NEVER deployed via rsync — it lives only on the server.
      # Set it manually once via cPanel or SSH, then leave it in place.
      # rsync 3.1.3 on the server cannot create nested dest dirs; mkdir -p first.
      - name: Ensure salary-service deploy directory exists
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p '${{ env.SALARY_DEPLOY_ROOT }}/public'"

      - name: Deploy salary-service backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'logs/' \
            --exclude 'keys/' \
            salary-service/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SALARY_DEPLOY_ROOT }}/

      - name: Deploy salary-service frontend (dist to server)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            salary-service-frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SALARY_DEPLOY_ROOT }}/public/

      - name: Install salary-service dependencies and restart PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            source ~/.bashrc
            cd ${{ env.SALARY_DEPLOY_ROOT }}
            npm ci --omit=dev
            # --env production is mandatory — default block runs NODE_ENV=development
            pm2 restart salary-service --update-env || pm2 start ecosystem.config.js --only salary-service --env production
            pm2 save
          EOF
