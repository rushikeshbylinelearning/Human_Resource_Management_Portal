name: Deploy to Testing

on:
  push:
    branches:
      - master

env:
  DEPLOY_ROOT: /home/bylinelm/attendance-test.bylinelms.com
  SALARY_DEPLOY_ROOT: /home/bylinelm/payroll-test.bylinelms.com/salary-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── AMS backend ───────────────────────────────────────────────────────────
      - name: Deploy AMS backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'keys/' \
            --exclude 'logs/' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_ROOT }}/backend/

      - name: Deploy frontend build (dist contents to site root)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'backend' \
            --exclude '.htaccess' \
            --exclude '.well-known' \
            --exclude 'cgi-bin' \
            frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_ROOT }}/

      - name: Install AMS dependencies and restart PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            source ~/.bashrc
            cd /home/bylinelm/attendance-test.bylinelms.com/backend
            npm ci --omit=dev
            pm2 restart attendancetest-backend --update-env
            pm2 save
          EOF

      # ── salary-service frontend ──────────────────────────────────────────────
      - name: Install and build salary-service frontend
        working-directory: salary-service-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api

      # ── salary-service backend + built frontend ───────────────────────────────
      # .env is NEVER deployed via rsync — it lives only on the server.
      # Set it manually once via cPanel or SSH, then leave it in place.
      # rsync 3.1.3 on the server cannot create nested dest dirs; mkdir -p first.
      - name: Ensure salary-service deploy directory exists
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p '${{ env.SALARY_DEPLOY_ROOT }}/public'"

      - name: Deploy salary-service backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'logs/' \
            --exclude 'keys/' \
            salary-service/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SALARY_DEPLOY_ROOT }}/

      - name: Deploy salary-service frontend (dist to server)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            salary-service-frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SALARY_DEPLOY_ROOT }}/public/

      - name: Install salary-service dependencies and restart PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            source ~/.bashrc
            cd ${{ env.SALARY_DEPLOY_ROOT }}
            npm ci --omit=dev
            # --env production is mandatory — default block runs NODE_ENV=development
            pm2 restart salary-service --update-env || pm2 start ecosystem.config.js --only salary-service --env production
            pm2 save
          EOF
