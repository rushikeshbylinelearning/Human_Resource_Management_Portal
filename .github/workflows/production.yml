name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_ROOT: /home/bylinelm/attendance.bylinelms.com
  SALARY_DEPLOY_ROOT: /home/bylinelm/payroll.bylinelms.com/salary-service
  AMS_PROD_PORT: 3011
  AMS_TEST_PORT: 3015

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── AMS production (attendance.bylinelms.com :3011) ──────────────────────
      - name: Deploy AMS backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'keys/' \
            --exclude 'logs/' \
            --exclude 'ecosystem.config.cjs' \
            --exclude 'scripts/ensure-test-env.js' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_ROOT }}/backend/

      - name: Deploy frontend build (dist contents to site root)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'backend' \
            --exclude '.htaccess' \
            --exclude '.well-known' \
            --exclude 'cgi-bin' \
            frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_ROOT }}/

      - name: Install AMS dependencies and restart production PM2 on :3011
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            source ~/.bashrc
            cd /home/bylinelm/attendance.bylinelms.com/backend
            npm ci --omit=dev

            # Restart ONLY production AMS. Never delete/restart:
            #   attendancetest-backend (:3015)
            #   dg-awareness-backend (:5005)
            #   salary-service / other PM2 apps
            pm2 restart attendance-backend --update-env \
              || pm2 start server.js --name attendance-backend
            pm2 save

            echo "Waiting for production AMS on :3011..."
            healthy=0
            for i in $(seq 1 20); do
              code=$(curl -sS -o /tmp/ams-prod-health.json -w '%{http_code}' "http://127.0.0.1:3011/health" || true)
              body=$(cat /tmp/ams-prod-health.json 2>/dev/null || true)
              if [ "$code" = "200" ] && echo "$body" | grep -q '"status"'; then
                echo "attendance-backend is healthy on :3011"
                echo "$body"
                echo
                healthy=1
                break
              fi
              echo "health attempt $i: HTTP ${code:-down}"
              sleep 2
            done

            if [ "$healthy" != "1" ]; then
              echo "production AMS did not become healthy on :3011"
              pm2 describe attendance-backend || true
              pm2 logs attendance-backend --lines 80 --nostream || true
              exit 1
            fi

            echo "Confirming test AMS on :3015 was not taken down..."
            if curl -fsS "http://127.0.0.1:3015/health" >/dev/null; then
              echo "Test AMS on :3015 is still healthy"
            else
              echo "WARN: test AMS on :3015 is not responding (not started or already down). Production deploy did not target it."
            fi
            pm2 list
          EOF

      # ── salary-service production ─────────────────────────────────────────────
      - name: Install and build salary-service frontend
        working-directory: salary-service-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: Ensure salary-service deploy directory exists
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p '${{ env.SALARY_DEPLOY_ROOT }}/public'"

      - name: Deploy salary-service backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'logs/' \
            --exclude 'keys/' \
            salary-service/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SALARY_DEPLOY_ROOT }}/

      - name: Deploy salary-service frontend (dist to server)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            salary-service-frontend/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SALARY_DEPLOY_ROOT }}/public/

      - name: Install salary-service dependencies and restart PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            source ~/.bashrc
            cd /home/bylinelm/payroll.bylinelms.com/salary-service
            npm ci --omit=dev
            pm2 restart salary-service --update-env || pm2 start server.js --name salary-service
            pm2 save
          EOF
